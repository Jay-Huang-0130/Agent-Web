pid /run/agent-web/nginx.pid;
error_log /dev/stderr info;
worker_processes 1;

events {
    worker_connections 1024;
}
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    client_body_temp_path /tmp/agent-web-nginx/client-body;
    proxy_temp_path /tmp/agent-web-nginx/proxy;
    fastcgi_temp_path /tmp/agent-web-nginx/fastcgi;
    uwsgi_temp_path /tmp/agent-web-nginx/uwsgi;
    scgi_temp_path /tmp/agent-web-nginx/scgi;

    server {
        listen 6901 ssl;
        server_name _;

        ssl_certificate /state/tls.crt;
        ssl_certificate_key /state/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:AGENT_WEB_TLS:10m;
        ssl_session_timeout 1d;

        auth_basic "Agent Web";
        auth_basic_user_file /state/htpasswd;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-cache" always;

        location = / {
            return 302 /vnc.html?autoconnect=1&reconnect=1&reconnect_delay=1000&resize=scale&shared=1&path=websockify;
        }

        location / {
            proxy_pass http://127.0.0.1:6080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
